  services:
    db:
      image: postgres:15
      container_name: crm_postgres
      restart: always
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data
    redis:
      image: redis:7
      ports:
        - "6379:6379"


    crm:
      build: .
      container_name: pro-suite-crm-docker
      command: >
        sh -c "python manage.py makemigrations &&
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              uvicorn core.asgi:application --host 0.0.0.0 --port 8000 --workers 1 --reload"
      ports: 
        - "80:8000"
      environment:
        SECRET_KEY: ${SECRET_KEY}
        DEBUG: ${DEBUG}
        DATABASE_URL: ${DATABASE_URL}
      depends_on: 
        - db 
        - redis
      env_file:
        - .env

      volumes:
        - .:/app   




  volumes:
    postgres_data: